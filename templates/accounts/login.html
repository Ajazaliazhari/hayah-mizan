{% extends 'base.html' %}

{% block title %}Login - HAYAH MIZAN{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="text-center mb-8">
        <h1 class="font-serif text-3xl font-bold mb-2">Welcome Back</h1>
        <p class="text-gray-500 text-sm">Sign in to your account</p>
    </div>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm tracking-widest mb-2">EMAIL</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
        </div>
        <div>
            <label class="block text-sm tracking-widest mb-2">PASSWORD</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
        </div>
        <button type="submit" class="w-full bg-black text-white py-4 text-sm tracking-widest hover:bg-gray-800 transition">
            SIGN IN
        </button>
    </form>
    
    <p class="text-center text-sm text-gray-500 mt-6">
        New to HAYAH MIZAN? 
        <a href="{% url 'accounts:register' %}" class="text-black underline">Create an account</a>
    </p>
</div>
{% endblock %}

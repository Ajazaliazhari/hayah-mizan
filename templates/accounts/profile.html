{% extends 'base.html' %}

{% block title %}My Profile - HAYAH MIZAN{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12">
    <h1 class="font-serif text-3xl font-bold mb-8">My Profile</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label class="block text-xs tracking-widest mb-2">{{ field.label|upper }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit"
                class="bg-black text-white px-8 py-4 text-sm tracking-widest hover:bg-gray-800 transition">
            SAVE CHANGES
        </button>
    </form>
</div>

<script>
document.querySelectorAll('form input, form select, form textarea').forEach(el => {
    if (el.type !== 'submit' && el.type !== 'hidden' && el.type !== 'file') {
        el.classList.add('w-full', 'px-4', 'py-3', 'border', 'border-gray-300',
                          'text-sm', 'focus:outline-none', 'focus:border-black');
    }
});
</script>
{% endblock %}

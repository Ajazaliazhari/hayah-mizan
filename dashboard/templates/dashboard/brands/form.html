{% extends 'dashboard/base.html' %}
{% block page_title %}{{ action }} Brand{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <a href="{% url 'dashboard:brand_list' %}" class="text-xs text-gray-500 hover:text-black">← Back to Brands</a>

    <form method="post" enctype="multipart/form-data" class="bg-white p-6 rounded border border-gray-200 mt-4 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs tracking-widest mb-2">NAME *</label>
                <input type="text" name="name" required value="{{ brand.name|default:'' }}"
                       class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs tracking-widest mb-2">SLUG</label>
                <input type="text" name="slug" value="{{ brand.slug|default:'' }}"
                       placeholder="auto-generated"
                       class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
            </div>
        </div>

        <div>
            <label class="block text-xs tracking-widest mb-2">DESCRIPTION</label>
            <textarea name="description" rows="3"
                      class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">{{ brand.description|default:'' }}</textarea>
        </div>

        <div>
            <label class="block text-xs tracking-widest mb-2">WEBSITE</label>
            <input type="url" name="website" value="{{ brand.website|default:'' }}" placeholder="https://"
                   class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
        </div>

        <div>
            <label class="block text-xs tracking-widest mb-2">LOGO</label>
            {% if brand.logo %}
            <img src="{{ brand.logo.url }}" class="w-40 h-20 object-contain bg-gray-50 rounded mb-3">
            {% endif %}
            <input type="file" name="logo" accept="image/*"
                   class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
        </div>

        <div>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="is_active" {% if brand.is_active or not brand %}checked{% endif %} class="w-4 h-4">
                <span class="text-sm">Active</span>
            </label>
        </div>

        <div class="flex gap-3 pt-4 border-t">
            <button type="submit" class="bg-black text-white px-6 py-3 text-xs tracking-widest hover:bg-gray-800">
                SAVE BRAND
            </button>
            <a href="{% url 'dashboard:brand_list' %}"
               class="px-6 py-3 text-xs tracking-widest border border-gray-300 hover:border-black">CANCEL</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'dashboard/base.html' %}
{% block page_title %}{{ action }} Category{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <a href="{% url 'dashboard:category_list' %}" class="text-xs text-gray-500 hover:text-black">← Back to Categories</a>

    <form method="post" enctype="multipart/form-data" class="bg-white p-6 rounded border border-gray-200 mt-4 space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs tracking-widest mb-2">NAME *</label>
                <input type="text" name="name" required value="{{ category.name|default:'' }}"
                       class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs tracking-widest mb-2">SLUG</label>
                <input type="text" name="slug" value="{{ category.slug|default:'' }}"
                       placeholder="auto-generated if empty"
                       class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
            </div>
        </div>

        <div>
            <label class="block text-xs tracking-widest mb-2">DESCRIPTION</label>
            <textarea name="description" rows="3"
                      class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">{{ category.description|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs tracking-widest mb-2">PARENT CATEGORY</label>
                <select name="parent" class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
                    <option value="">— None (top-level) —</option>
                    {% for p in parents %}
                    <option value="{{ p.pk }}" {% if category.parent_id == p.pk %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs tracking-widest mb-2">SORT ORDER</label>
                <input type="number" name="order" value="{{ category.order|default:0 }}"
                       class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
                <p class="text-xs text-gray-500 mt-1">Lower numbers appear first.</p>
            </div>
        </div>

        <div>
            <label class="block text-xs tracking-widest mb-2">CATEGORY IMAGE</label>
            {% if category.image %}
            <img src="{{ category.image.url }}" class="w-32 h-40 object-cover rounded mb-3">
            {% endif %}
            <input type="file" name="image" accept="image/*"
                   class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-black">
            <p class="text-xs text-gray-500 mt-1">Recommended: 800×1000px, under 500KB.</p>
        </div>

        <div>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="is_active" {% if category.is_active or not category %}checked{% endif %}
                       class="w-4 h-4">
                <span class="text-sm">Active (visible on site)</span>
            </label>
        </div>

        <div class="flex gap-3 pt-4 border-t">
            <button type="submit"
                    class="bg-black text-white px-6 py-3 text-xs tracking-widest hover:bg-gray-800 transition">
                SAVE CATEGORY
            </button>
            <a href="{% url 'dashboard:category_list' %}"
               class="px-6 py-3 text-xs tracking-widest border border-gray-300 hover:border-black transition">
                CANCEL
            </a>
        </div>
    </form>
</div>
{% endblock %}
